name: Autonomous Google Form Submission

on:
  schedule:
    # Auto-generated by Auto Google Form Filler
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch:
    # Allows manual test triggers anytime from GitHub Web / Mobile App

jobs:
  fill-form:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Form Filler
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          FORM_SUBMISSION_EMAIL: ${{ secrets.FORM_SUBMISSION_EMAIL }}
        run: |
          python src/main.py
